apiVersion: batch/v1
kind: Job
metadata:
  name: hpc-mpi-sim
  namespace: default
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: hpc-mpi
    spec:
      restartPolicy: Never
      containers:
      - name: mpi-node
        image: docker.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - |
          OUT="/mnt/nfs/mpi_results.txt"
          echo "MPI Process initialized on Pod: $HOSTNAME" >> $OUT
          echo "Hello World from MPI Process on node $HOSTNAME!" >> $OUT
          echo "MPI Process on $HOSTNAME finished." >> $OUT
        volumeMounts:
        - mountPath: /mnt/nfs
          name: nfs-storage
      volumes:
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: nfs-pvc

