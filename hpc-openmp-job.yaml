apiVersion: batch/v1
kind: Job
metadata:
  name: hpc-openmp-parallel
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: hpc-openmp
    spec:
      restartPolicy: Never
      containers:
      - name: openmp-runner
        image: docker.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - |
          OUT="/mnt/nfs/openmp_results.txt"
          echo "=== OpenMP Multi-Threaded Task Simulation ===" > $OUT
          echo "Node: $HOSTNAME | Active Threads: 4" >> $OUT
          echo "Start Time: $(date)" >> $OUT
          
          # Function executing parallel thread tasks (#pragma omp parallel)
          run_thread() {
            T_ID=$1
            echo "Thread $T_ID initialized on core assignment..." >> $OUT
            sum=0
            i=1
            while [ $i -le 10000 ]; do
              sum=$((sum + i))
              i=$((i + 1))
            done
            echo "Thread $T_ID completed execution. Checksum: $sum" >> $OUT
          }
          
          # Launch 4 parallel worker threads in background
          run_thread 0 &
          run_thread 1 &
          run_thread 2 &
          run_thread 3 &
          
          # Barrier synchronization (#pragma omp barrier)
          wait
          
          echo "End Time: $(date)" >> $OUT
          echo "Status: SUCCESS (All 4 OpenMP threads joined)" >> $OUT
          echo "OpenMP parallel execution finished successfully."
        resources:
          requests:
            cpu: "1"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        volumeMounts:
        - mountPath: /mnt/nfs
          name: nfs-storage
      volumes:
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: nfs-pvc
